# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CICD

on:
  push:  
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  compile:

    runs-on: Agent-1

   
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    
    - name: Use Node.js 
      uses: actions/setup-node@v4
      with:
        node-version: '23'



    - name: Frontend Syntax Check
      run: |
          cd client
          find . -name "*.js" -exec node --check {} +

    - name: Backend Syntax check
      run: |
          cd api
          find . -name "*.js" -exec node --check {} +
  gitleaks:
   runs-on: Agent-1
   needs: compile

   steps:
     - name: Checkout Code
       uses: actions/checkout@v4

     - name: Gitleaks Setup
       uses: gitleaks/gitleaks-action@v2
     - name: Gitleaks Scan
       run: |
         gitleaks detect --source ./client --exit-code 1
         gitleaks detect --source ./api --exit-code 1 
  trivy_scan:
    runs-on: Agent-1
    needs: gitleaks
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Run Trivy Vulnerabiltiy scanner
        uses: aquasecurity/trivy-actions@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          
  
